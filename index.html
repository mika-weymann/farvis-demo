<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farvis – Procurement price intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>:root{--hl:#0E3A55;--hlt:#FFFFFF;--hx:#0E3A55;--ink:#14181C;--mute:#5B636B;--line:#DDE0E3;--bg:#FFFFFF;--card:#F2F3F4;--surf:#FFFFFF;--hover:#FFFFFF;--mid:#9AA6B2;--c1:#0E3A55;--c2:#7F8A95;--c3:#CDD3D9;--gapfill:rgba(14,58,85,.13);--field:#C3CAD1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#2B6A94;--hlt:#FFFFFF;--hx:#9CC3E0;--ink:#ECEFF2;--mute:#A3ACB5;--line:#2C343B;--bg:#0E1215;--card:#181E23;--surf:#0E1215;--hover:#20282E;--mid:#6F7B86;--c1:#ECEFF2;--c2:#8A96A1;--c3:#2F3941;--gapfill:rgba(156,195,224,.16);--field:#36424B;color-scheme:dark}}
:root[data-theme="dark"]{--hl:#2B6A94;--hlt:#FFFFFF;--hx:#9CC3E0;--ink:#ECEFF2;--mute:#A3ACB5;--line:#2C343B;--bg:#0E1215;--card:#181E23;--surf:#0E1215;--hover:#20282E;--mid:#6F7B86;--c1:#ECEFF2;--c2:#8A96A1;--c3:#2F3941;--gapfill:rgba(156,195,224,.16);--field:#36424B;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Lato',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 16px 20px;position:sticky;top:0;height:100vh}
.side .logo{width:148px;height:auto;margin:0 10px 38px;display:block}
.side .dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side .lt{display:none}:root:not([data-theme="light"]) .side .dk{display:block}}
:root[data-theme="dark"] .side .lt{display:none}:root[data-theme="dark"] .side .dk{display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--mute);padding:11px 12px;border-radius:4px;font-size:15px;font-weight:700}
.nav button:hover{background:var(--card);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--hl);color:var(--hlt)}
.nav svg{width:20px;height:20px;flex:none}
.side .co{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.side .co b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.main{flex:1;min-width:0;padding:32px 40px 60px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:30px;line-height:1.15;margin:0 0 4px;font-weight:900;letter-spacing:-.3px}
.sub{color:var(--mute);margin:0}
.card{background:var(--card);border-radius:4px;padding:22px 24px}
.card h2{font-size:16px;margin:0 0 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:12px}
.card h2 small{font-weight:400;color:var(--mute);font-size:13px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.kpi .lab{color:var(--mute);font-size:14px;margin-bottom:6px}
.kpi .val{font-size:42px;font-weight:900;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi .note{color:var(--mute);font-size:13.5px;margin-top:6px}
.kpi.dark,.tile.hero{background:var(--hl);color:var(--hlt)}
.kpi.dark .lab,.kpi.dark .note,.tile.hero .lab{color:rgba(255,255,255,.78)}
.two{grid-template-columns:minmax(0,7fr) minmax(0,5fr);margin-bottom:16px}
.up{color:var(--hx);font-weight:900}
.hint{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 6px;border-radius:0}
.hint:first-of-type{border-top:0}
.hint:hover{background:var(--hover)}
.hint .dot{width:9px;height:9px;border-radius:50%;background:var(--hl);margin-top:7px;flex:none}
.hint .dot.read{background:var(--mid)}
.hint .t{font-weight:700}
.hint .s{color:var(--mute);font-size:14px}
.hint .r{margin-left:auto;text-align:right;flex:none}
.hint .r b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.hint .r span{color:var(--mute);font-size:13px}
.bars .row{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:9px 0}
.bars .track{height:16px;background:var(--c3);border-radius:2px;position:relative}
.bars .track i{position:absolute;left:0;top:0;bottom:0;background:var(--hl);border-radius:2px 0 0 2px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.legend{display:flex;gap:16px;color:var(--mute);font-size:13px;flex-wrap:wrap;font-weight:400}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14.5px}
tbody tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hover)}
.pill{display:inline-block;padding:2px 10px;border-radius:3px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.flag{background:var(--hl);color:var(--hlt)}
.pill.watch{border:1px solid var(--mute);color:var(--mute)}
.pill.ok{background:var(--surf);color:var(--mute)}
.minibar{display:inline-block;width:70px;height:8px;background:var(--c3);border-radius:2px;vertical-align:middle;margin-left:8px;position:relative}
.minibar i{position:absolute;left:0;top:0;bottom:0;background:var(--hl);border-radius:2px}
.btn{background:var(--hl);color:var(--hlt);border:1px solid var(--hl);padding:9px 16px;border-radius:4px;font-weight:700;font-size:14.5px}
.btn:hover{filter:brightness(1.18)}
.btn.ghost{background:var(--surf);color:var(--ink);border-color:var(--field)}
.btn.ghost:hover{filter:none;border-color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--field);background:var(--surf);padding:6px 13px;border-radius:4px;font-size:14px;font-weight:700;color:var(--mute)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--hl);border-color:var(--hl);color:var(--hlt)}
input,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--field);border-radius:4px;padding:7px 10px}
input[type=number]{width:72px;text-align:right}
input[type=checkbox]{accent-color:var(--hl)}
.an{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.list{padding:12px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:16px}.list input[type=search]{width:100%;margin:0 0 8px}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr));margin:0}
.tile{padding:16px 20px}
.tile .lab{color:var(--mute);font-size:13.5px}
.tile .val{font-size:28px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.cols{grid-template-columns:1fr;margin:16px 0}
@media (min-width:1900px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.ctable td,.ctable th{padding:8px 8px}.ctable td:first-child{min-width:150px}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.xbtn{background:none;border:0;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.xbtn:hover{background:var(--surf);color:var(--ink)}
.dec .r{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.dec .tr{position:relative;height:14px}
.dec .tr::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--mid)}
.dec .tr i{position:absolute;top:0;bottom:0;border-radius:2px}
.dec .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.dec .sum{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.rec{background:var(--card);box-shadow:inset 4px 0 0 var(--hl)}
.up2{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.drop{border:1.5px dashed var(--mid);border-radius:4px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.drop small{color:var(--mute)}
.note2{color:var(--mute);font-size:13.5px}
.cock{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
.arg{border-radius:4px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
.arg.off{opacity:.55}
.arg .h{display:flex;gap:10px;align-items:flex-start}
.rk{width:26px;height:26px;border-radius:50%;background:var(--hl);color:var(--hlt);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.arg.off .rk{background:var(--mid)}
.arg .t{font-weight:700;flex:1}
.arg .m{color:var(--mute);font-size:13.5px;font-weight:400}
.arg .ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surf);padding:5px 11px;font-size:13px;font-weight:700;color:var(--mute);border-right:1px solid var(--field)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--hl);color:var(--hlt)}
.mv{margin-left:auto;display:flex;gap:4px}
.paper{padding:34px 38px;background:var(--surf);border:1px solid var(--line)}
.paper h2{font-size:22px;margin:0 0 4px}
.paper .lead{color:var(--mute);margin:0 0 18px}
.paper h3{font-size:16px;margin:22px 0 8px}
.paper p{margin:0 0 10px}
.fig{display:flex;gap:30px;flex-wrap:wrap;margin:14px 0 4px}
.fig div b{display:block;font-size:28px;line-height:1.1;font-weight:900;letter-spacing:-.5px}
.fig div span{color:var(--mute);font-size:13.5px}
.dargs{margin:10px 0 0;padding:0;list-style:none}
.dargs>li{border-top:1px solid var(--line);padding:16px 0}
.dargs li ul{list-style:disc;margin:0 0 6px;padding-left:18px}.dargs li li{border:0;padding:2px 0}
.dargs .ttl{display:flex;gap:10px;align-items:center;font-weight:900;font-size:16px}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;border:1px solid var(--mid);color:var(--mute)}
.tag.High{background:var(--hl);border-color:var(--hl);color:var(--hlt)}
.ask{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.ask label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.ask input[type=text]{width:100%}
.empty{color:var(--mute);padding:26px 4px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:4px;font-size:13px;line-height:1.5;display:none;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--hl);color:var(--hlt);padding:11px 18px;border-radius:4px;font-weight:700;z-index:60}
@media (max-width:1180px){.kpis,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.an,.cock{grid-template-columns:1fr}.list{position:static;max-height:340px}}
@media (max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:12px 14px;gap:16px;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side .logo{margin:0;width:104px}.nav{flex-direction:row;flex-wrap:wrap}.nav button{padding:8px 10px;font-size:14px}.side .co{display:none}.main{padding:20px 16px 44px}.kpis,.tiles{grid-template-columns:1fr}.ask{grid-template-columns:1fr}.bars .row{grid-template-columns:110px 1fr 96px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.li,.hint,.nav button{transition:background .12s,filter .12s,border-color .12s}}

.themebtn{position:absolute;top:24px;right:12px;width:34px;height:34px;border:1px solid var(--field);background:var(--surf);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mute);padding:0}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.themebtn svg{width:18px;height:18px}
.panel h2{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;font:inherit;font-weight:900;font-size:16px;text-align:left;color:inherit;border-radius:4px}
.ph small{font-weight:400;color:var(--mute);font-size:13px}
.ph .pr{display:flex;align-items:center;gap:12px}
.chev{width:18px;height:18px;flex:none;color:var(--mute);transition:transform .15s}
.ph[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.pb{margin-top:16px}
.pb[hidden]{display:none}
.ov1{grid-template-columns:minmax(0,7fr) minmax(0,5fr);margin-bottom:16px;align-items:start}
.ov2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.bars .row.btnrow{width:100%;background:none;border:0;text-align:left;padding:9px 6px;border-radius:4px;color:inherit;font:inherit}
.bars .row.btnrow:hover{background:var(--hover)}
.bars .row small{color:var(--mute);font-size:12.5px}
.bars .n span{color:var(--mute)}
.sumline{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 10px;color:var(--mute);font-size:13.5px}
.sumline b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
@media (max-width:1180px){.ov1,.ov2{grid-template-columns:1fr}}
@media (max-width:820px){.side{position:relative}.themebtn{top:12px;right:14px}}

.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.bars.sup .row{grid-template-columns:190px 1fr 130px}
@media (max-width:820px){.bars.sup .row{grid-template-columns:120px 1fr 100px}}

.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:11px 10px;margin-bottom:1px}
.li:hover{background:var(--hover)}
.li[aria-current="true"]{background:var(--surf);box-shadow:inset 3px 0 0 var(--hl)}
.li .ltx{flex:1;min-width:0;display:flex;flex-direction:column}
.li .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sp{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .pot{font-weight:700;font-variant-numeric:tabular-nums}
.st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c3)}
.st.flag{background:var(--hl)}
.st.watch{background:none;border:2px solid var(--mid)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.dhead h1{font-size:26px;margin:0 0 2px}
.sync{display:flex;align-items:center;gap:14px;color:var(--mute);font-size:13.5px;flex-wrap:wrap}
.okdot{width:8px;height:8px;border-radius:50%;background:var(--hl);display:inline-block;margin-right:-6px}
.link{background:none;border:0;padding:0;color:var(--hx);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 18px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 14px;font-weight:700;color:var(--mute);font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hl)}
.ctrls{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.flab{display:block;color:var(--mute);font-size:13.5px;margin-bottom:6px}
.arg{background:var(--surf);padding:12px 14px}
.arg .h{align-items:center}
.arg .v{font-weight:700;font-variant-numeric:tabular-nums}
.arg .ctl{margin-top:8px;padding-left:62px}
.parg{border-top:1px solid var(--line);list-style:none}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 2px;text-align:left;font:inherit;color:inherit}
.pbtn .pt{font-weight:900;font-size:16px;flex:1}
.pbtn .pv{font-weight:700;font-variant-numeric:tabular-nums}
.pbtn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.pbody{padding:0 2px 18px 38px}
.pbody[hidden]{display:none}
.dargs>li.parg{padding:0}
.pdfrow{display:flex;gap:14px;align-items:center;margin-top:20px;flex-wrap:wrap}
.card .h2row{display:flex;justify-content:space-between}
.card.list{background:var(--card)}
@media (max-width:1180px){.tiles{grid-template-columns:1fr}}
@media (max-width:820px){.arg .ctl{padding-left:0}}

.dz{border:2px dashed var(--mid);border-radius:6px;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:28px;cursor:pointer}
.dz:hover,.dz.over{border-color:var(--hl);background:var(--hover)}
.dz.big{min-height:400px}
.dz.small{min-height:130px;padding:18px;gap:6px}
.dzico{width:72px;height:72px;border-radius:50%;background:var(--hl);color:var(--hlt);display:flex;align-items:center;justify-content:center}
.dzico svg{width:50%;height:50%}
.dzt{font-size:22px;font-weight:900;letter-spacing:-.3px}
.upg{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
textarea{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--field);border-radius:4px;padding:10px;width:100%;min-height:110px;resize:vertical}
.xitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.xitem .xn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.xitem .xs{color:var(--mute);font-size:13px}
.mini{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}
.mini div{background:var(--surf);padding:10px 12px;border-radius:4px}
.mini b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.mini span{color:var(--mute);font-size:12.5px}
.steps{list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--mute)}
.steps li.done{color:var(--ink)}
.steps li.now{color:var(--ink);font-weight:700}
.sdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--c3);flex:none;display:flex;align-items:center;justify-content:center}
.steps li.done .sdot{background:var(--hl);border-color:var(--hl);color:var(--hlt)}
.steps li.now .sdot{border-color:var(--hl)}
@media (prefers-reduced-motion:no-preference){.steps li.now .sdot{animation:pl 1s ease-in-out infinite}}
@keyframes pl{50%{box-shadow:0 0 0 4px rgba(120,150,175,.28)}}
@media (max-width:1180px){.upg{grid-template-columns:1fr}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function compOf(a) { return S.comp[a.id] || a.comp; }
function relS(k, t) {

  const v = D.series[k].v; return v[t] / v[0];
}
function fairArr(a) {
  const c = compOf(a), key = a.id + JSON.stringify(c) + S.labour;
  if (memo.has(key)) return memo.get(key);
  const tw = sum(Object.values(c)) || 1, r = [];
  for (let t = 0; t < N; t++) r.push(a.price[0] * Object.entries(c).reduce((s, [k, w]) => s + w * relS(k, t), 0) / tw);

  const q12 = sum(a.qty.slice(-12));
  const spend12 = sum(a.price.slice(-12).map((p, i) => p * a.qty[N-12+i]));

  let iMin = iMax; for (let i = iMax; i < N; i++) if (fair[i] < fair[iMin]) iMin = i;

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === ';' || c === '\t') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

    S.run = null; S.upload = {name: f.name, rows: body.length, articles: new Set(body.map(r => r[need.article])).size, suppliers: new Set(body.map(r => r[need.supplier])).size,

async function saveFile(name, data, type) {
